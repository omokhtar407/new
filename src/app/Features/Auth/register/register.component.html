<h1>Register Form</h1>


<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <form [formGroup]="regForm" (ngSubmit)="Register()">
        <input formControlName="name" type="text" class="form-control" placeholder="Name...">
        <input formControlName="email" type="email" class="form-control" placeholder="Email...">
        <input formControlName="password" type="password" class="form-control" placeholder="Password...">
        <input formControlName="rePassword" type="password" class="form-control" placeholder="RePassword...">
        <input formControlName="phone" type="text" class="form-control" placeholder="Phone...">
        <button class="btn btn-success">Register</button>
      </form>
    </div>
  </div>
</div>
